<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ООМ — Объектно-ориентированная математика</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="btn-sidebar" class="btn ghost" title="Показать/скрыть панель" data-icon="menu"></button>
      <h1><span class="ic" data-icon="hammer" data-icon-size="26"></span>ООМ</h1>
      <nav id="scene-tabs" class="scene-tabs"></nav>
      <div class="topbar-right">
        <button id="btn-reader" class="btn ghost" title="Учебник" data-icon="book"></button>
        <div class="history-wrap">
          <button id="btn-board" class="btn ghost" title="Доска: сохранить, загрузить, перенести" data-icon="save"></button>
          <div id="board-menu" class="history-dropdown board-menu" hidden>
            <button id="btn-save" class="menu-item">💾 Сохранить в браузере</button>
            <button id="btn-load" class="menu-item">📂 Загрузить сохранённую</button>
            <hr />
            <button id="btn-file-save" class="menu-item">⤓ Скачать файлом</button>
            <button id="btn-file-load" class="menu-item">⤒ Загрузить из файла</button>
            <hr />
            <button id="btn-export-ex" class="menu-item">📤 Заготовка упражнения — в буфер</button>
          </div>
        </div>
        <div class="history-wrap">
          <button id="btn-settings" class="btn ghost" title="Настройки"><span class="ic" data-icon="gear"></span></button>
          <div id="settings-menu" class="history-dropdown board-menu" hidden>
            <label class="field tp-check" title="Маленький бейдж на чипе молотка: сколько раз им успешно ударили — для (−1)ⁿ и чёт/нечет"><input type="checkbox" id="set-hits" /> счётчик ударов у молотков</label>
            <label class="field tp-check" title="Секции сайдбара стартуют свёрнутыми; разворачиваются кликом по заголовку"><input type="checkbox" id="set-collapsed" /> панели по умолчанию свёрнуты</label>
            <label class="field tp-check" title="Новые фигуры (прямоугольники, полигоны, круги) рождаются с подписью площади; у каждой фигуры флаг личный — правится ПКМ-карточкой или галками сцены"><input type="checkbox" id="set-def-area" /> площадь у новых фигур</label>
            <label class="field tp-check" title="Новые фигуры рождаются с подписью периметра (у круга — длины окружности)"><input type="checkbox" id="set-def-perim" /> периметр у новых фигур</label>
            <label class="field tp-check" title="Новые полигоны рождаются с подписями углов при вершинах"><input type="checkbox" id="set-def-angles" /> углы у новых фигур</label>
            <label class="field tp-check" title="Шлейф истории значений под выделенной коробкой: «7 → 10 → 100 →»"><input type="checkbox" id="set-trail" /> история значений у коробок</label>
          </div>
        </div>
        <div class="history-wrap">
          <button id="btn-history" class="btn ghost" title="История" data-icon="history"></button>
          <div id="history-dropdown" class="history-dropdown" hidden>
            <div id="diagnosis-map" class="diagnosis-map" hidden></div>
            <ol id="subtitles" class="subtitles"></ol>
          </div>
        </div>
        <button id="btn-undo" class="btn ghost" title="Отменить последнее действие"><span class="ic" data-icon="undo"></span>Отменить</button>
      </div>
    </header>
    <main class="layout">
      <aside class="sidebar" id="sidebar">
        <section class="panel" id="panel-tools">
          <h3>Инструменты</h3>
          <div id="tool-list" class="tool-list"></div>
          <div class="tool-forge">
            <select id="forge-op">
              <optgroup label="арифметика">
                <option value="add">увеличить на</option>
                <option value="sub">уменьшить на</option>
                <option value="mul">умножить на</option>
                <option value="div">разделить на</option>
                <option value="pow">в степень (xⁿ)</option>
              </optgroup>
              <optgroup label="прикидка и остатки">
                <option value="round">округлить до (≈N)</option>
                <option value="mod">остаток от ÷N</option>
                <option value="quot">рядов по N</option>
              </optgroup>
              <optgroup label="функции">
                <option value="sq">в квадрат (x²)</option>
                <option value="cube">в куб (x³)</option>
                <option value="sqrt">корень (√x)</option>
                <option value="cbrt">кубокорень (∛x)</option>
                <option value="abs">модуль (|x|)</option>
              </optgroup>
              <optgroup label="для уравнений">
                <option value="addx">прибавить иксы (+n·x)</option>
                <option value="subx">убрать иксы (−n·x)</option>
              </optgroup>
            </select>
            <input id="forge-n" value="5" title="Число или дробь: 5, −2,75, 1/3" />
            <button id="forge-btn" class="btn accent"><span class="ic" data-icon="hammer" data-icon-size="20"></span>Создать</button>
          </div>
          <button id="combo-toggle" class="btn ghost">Комбо-инструмент</button>
          <div id="combo-forge" hidden>
            <select id="combo-op">
              <optgroup label="арифметика">
                <option value="add">увеличить на</option>
                <option value="sub">уменьшить на</option>
                <option value="mul">умножить на</option>
                <option value="div">разделить на</option>
                <option value="pow">в степень (xⁿ)</option>
              </optgroup>
              <optgroup label="прикидка и остатки">
                <option value="round">округлить до (≈N)</option>
                <option value="mod">остаток от ÷N</option>
                <option value="quot">рядов по N</option>
              </optgroup>
              <optgroup label="функции">
                <option value="sq">в квадрат (x²)</option>
                <option value="cube">в куб (x³)</option>
                <option value="sqrt">корень (√x)</option>
                <option value="cbrt">кубокорень (∛x)</option>
                <option value="abs">модуль (|x|)</option>
              </optgroup>
            </select>
            <div class="series-row">
              <input id="combo-n" value="1" title="Число или дробь: 5, −2,75, 1/3" />
              <button id="combo-add" class="btn ghost" title="Добавить шаг">+</button>
            </div>
            <div id="combo-steps" class="tool-list"></div>
            <div class="series-row">
              <input id="combo-name" placeholder="имя (необязательно)" maxlength="10" />
              <button id="combo-btn" class="btn accent">Собрать</button>
            </div>
          </div>
          <p class="hint" id="hand-hint">Кликни по инструменту — возьмёшь его в руку.
            Клик по объекту — удар. Правая кнопка — положить инструмент.</p>
        </section>
        <section class="panel" id="panel-objects">
          <h3>Объекты</h3>
          <div class="spawn-row" id="spawn-row">
            <input id="spawn-value" value="7" title="Число или дробь: 5, −2,75, 1/3" />
            <button id="spawn-btn" class="btn primary"><span class="ic" data-icon="plus"></span>Число</button>
          </div>
          <div class="spawn-row" id="var-row">
            <input id="var-name" value="a" maxlength="2" style="max-width:52px" title="Имя переменной" />
            <input id="var-value" value="0" style="max-width:72px" title="Стартовое значение: число или выражение — «3+6», «3/8», «sqrt(9)»" />
            <button id="spawn-var-btn" class="btn primary" title="Переменная — коробка с именем: в «Коробках» бьётся молотками, на «Числовой прямой» скользит ползунком; ПКМ по коробке — карточка значения и записи"><span class="ic" data-icon="plus"></span>Переменная</button>
          </div>
          <button id="spawn-set-btn" class="btn ghost" title="Создать набор чисел">Набор 0…10</button>
          <button id="hit-all-btn" class="btn ghost" title="Ударить инструментом в руке по всем объектам">Ударить по всем</button>
        </section>
        <div id="panel-scene" hidden></div>
      </aside>
      <div class="stage-wrap">
        <canvas id="stage"></canvas>
        <button id="edge-sidebar" class="edge-toggle" title="Свернуть/развернуть панель"></button>
        <button id="edge-reader" class="edge-toggle" title="Учебник"></button>
        <div id="task-panel" class="task-panel" hidden>
          <div class="task-head">
            <span id="task-status"></span>
            <b>Задание</b>
            <span id="task-steps" class="task-steps"></span>
            <span id="task-aim" class="task-aim" hidden></span>
            <span class="task-actions">
              <button id="task-hint" class="btn ghost" title="Подсказка" data-icon="bulb"></button>
              <button id="task-reset" class="btn ghost" title="Начать заново" data-icon="refresh"></button>
              <button id="task-close" class="btn ghost" title="Закрыть задание" data-icon="close"></button>
            </span>
          </div>
          <p id="task-text"></p>
          <div id="task-options" class="task-options" hidden></div>
          <p id="task-hint-text" class="hint" hidden></p>
        </div>
      </div>
      <aside id="reader" class="reader" hidden>
        <div id="reader-body" class="reader-body"></div>
      </aside>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
